# MoreShips (Project Beacon) configuration
#
# Edit this file and run /moreships reload (future slice) or restart the server.
# All values must be present; defaults are listed below.

# Ship cores, one per size (spec §2). The PDC marker identifies a real core
# item — a vanilla heart-of-the-sea never places a ship.
shipCore:
  small:
    material: HEART_OF_THE_SEA
    displayName: "Small Ship Core"
  medium:
    material: NAUTILUS_SHELL
    displayName: "Medium Ship Core"
  large:
    material: DRAGON_EGG
    displayName: "Large Ship Core"

placement:
  # Offset from the clicked block where the ship entity spawns.
  spawnOffsetX: 0.5
  spawnOffsetY: 1.0
  spawnOffsetZ: 0.5
  # Sound played on successful ship core placement.
  # See: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
  sound: BLOCK_CONDUIT_ACTIVATE
  soundVolume: 0.7
  soundPitch: 1.2

hull:
  # Minimum block hardness required for a hull material. Default 1.0 accepts
  # most wood, stone, and metal blocks; rejects dirt, wool, leaves, glass,
  # etc. Server owners can lower (more permissive) or raise (stricter).
  # Per-material overrides are a future slice.
  minHardness: 1.0

hp:
  # Ship max HP = round(hullHardness × multiplier), clamped to minimum 1.
  # Default 10 → stone (1.5) = 15 HP, obsidian (50) = 500 HP, planks (2) = 20.
  # Future slice adds core-size modifier and module HP changes per L1 spec.
  multiplier: 10.0

movement:
  # Master switch. When false, ships sit still even if piloted.
  enabled: true
  # Max forward speed in blocks per tick (20 ticks = 1 second).
  # Default 0.4 = 8 blocks/sec, comparable to a vanilla boat.
  # Set to 0 to effectively disable movement while keeping the pilot UI.
  maxSpeed: 0.4
  # Acceleration in blocks per tick². Applied each tick while piloted until
  # currentSpeed reaches maxSpeed. Default 0.02 → takes 20 ticks (1s) to reach
  # max speed from standstill (RQCA-14: speed at t≈0 ≠ max speed).
  acceleration: 0.02
  # Deceleration in blocks per tick² when no pilot is aboard (friction /
  # water drag). Default 0.05 → ship drifts to a stop in 8 ticks (~0.4s)
  # after the pilot dismounts.
  friction: 0.05
  # Hull turn rate in degrees per tick while the pilot steers (A/D),
  # vanilla-boat style. 4.0 = ~72 degrees/second.
  turnRate: 4.0
  # Session 2: speed factor per ship size — small fastest, large slowest.
  sizeSpeedFactor:
    small: 1.0
    medium: 0.8
    large: 0.6
  # Session 2: absolute ceiling on engine stacking — effective max speed can
  # never exceed maxSpeed × sizeFactor × engineHardCap, no matter the modules.
  engineHardCap: 2.0

modules:
  # Base vanilla material per module type (RQCA-08). The PersistentDataContainer
  # marker — not the material — identifies a real module item, so a vanilla
  # chest in hand never installs a cargo module.
  seat:
    material: OAK_STAIRS
    displayName: "Seat Module"
  cargo:
    material: CHEST
    displayName: "Cargo Module"
  cannon:
    material: DISPENSER
    displayName: "Cannon Module"
  engine:
    material: FURNACE
    displayName: "Engine Module"
  health:
    material: GOLDEN_APPLE
    displayName: "Health Module"

ship:
  # Physical hitbox (Interaction entity) size around the ship controller,
  # in blocks. This is what you actually click/punch/aim at.
  hitboxWidth: 3.0
  hitboxHeight: 1.8

physics:
  # Vertical water physics (blocks per tick).
  # riseVelocity: upward speed while fully submerged (buoyancy)
  riseVelocity: 0.35
  # sinkVelocity: downward speed while out of water (falls like a hull should)
  sinkVelocity: 0.30

collision:
  # Terrain collision for the ship hull (checked against the hitbox size).
  enabled: true
  # The collision box is the hitbox shrunk by this margin on each side, so a
  # ship fits into an appropriately sized dock without pixel-perfect placement.
  margin: 0.15

resourcepack:
  # Custom hull models need the MoreShips resource pack on clients. The plugin
  # pushes this URL to every player on join. Empty = no pack pushed.
  # Public permanent URL - the GitHub release always carries the newest pack.
  url: https://github.com/AdrianDrempetic2025/MoreShips/releases/latest/download/MoreShips-pack.zip

cannons:
  # Damage one cannon shot deals to another ship's HP.
  damage: 6.0
  # Per-cannon reload time in seconds.
  cooldownSeconds: 3.0
  # Shot speed in blocks per tick. Shots have gravity and a slight
  # downward arc so they can reach water-level hulls.
  speed: 2.0

recipes:
  # Crafting recipes for cores and modules (spec rough - not balanced).
  # small core  = iron | stick | iron (row)
  # medium core = wood+iron around 3 small cores
  # large core  = 2 medium cores + stick (row)
  # seat = 3 planks row; cargo = planks around chest; cannon = iron around fire charge
  enabled: true

stats:
  # Module-driven statistics (CON-10/11, RQCA-07, Session 2).
  # Speed multiplier per ship = 1 - modules*weight + engines*boost - hardness*penalty
  # (clamped 0.3..2.0). Health modules add healthBonus max HP each.
  weightPerModule: 0.08
  engineBoost: 0.25
  hardnessPenalty: 0.006
  healthBonus: 100
  # Session 2: each engine also multiplies acceleration (capped at 3x).
  engineAccelBoost: 0.5

combat:
  # Session 2: arrows deal this fraction of their normal damage to ships.
  arrowDamageFactor: 0.75

